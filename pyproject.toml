[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "ai-engineer-study"
version = "0.1.0"
description = "Personal study repo for AI engineering — experiments with LLM SDKs (Anthropic, OpenAI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "litellm",
    "google-genai",
    "langsmith>=0.8.5",
    "openai",
    "pgvector",
    "psycopg[binary]",
    "python-dotenv",
    "tiktoken",
    "transformers",
    "fastapi[standard]",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle — não exigimos docstrings em scripts de estudo
    "COM812",  # conflita com o formatter
    "ISC001",  # conflita com o formatter
    "CPY",     # flake8-copyright — sem cabeçalho de copyright
    "T201",    # permite print() em experimentos
    "T203",    # permite pprint() em experimentos
    "INP001",  # não exigir __init__.py em todo lugar
    "ERA001",  # permite código comentado em scripts exploratórios
    "FIX",     # permite TODO/FIXME sem falhar
    "TD",      # idem — formato livre de TODOs
    "TC",      # não exige mover imports para TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["S101"]  # asserts permitidos no scratch entry point
# Scripts de corpus dirigem git/pandoc por subprocess com args fixos (S603/S607),
# e a tabela de entidades contém caracteres unicode parecidos de propósito (RUF001).
"scripts/**/*.py" = ["S603", "S607", "RUF001", "TRY003", "EM101"]
"tests/**/*.py" = ["S101", "PLR2004"]  # asserts + literal comparisons are idiomatic in pytest
# A camada de DB faz ponte entre duas APIs de driver não-tipadas (sqlite3 / psycopg)
# e monta SQL com placeholders fixos por dialeto — Any e S608 são inerentes e seguros.
"src/db/infrastructure/*.py" = ["ANN401"]
"src/db/repositories/*.py" = ["ANN401", "S608"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
pretty = true
show_error_codes = true
show_column_numbers = true
